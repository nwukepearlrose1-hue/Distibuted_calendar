services:
  node0:
    build: .
    container_name: node0
    environment:
      NODE_ID: "0"
      BASE_RANDOM_SEED: "42"
      MIN_DELAY: "30"
      MAX_DELAY: "90"
      LOG_DIRECTORY: "/data"
    networks:
      - calendar-ring
    ports:
      - "8001:8000"
    volumes:
      - node0-data:/data
      - ./topology.local.json:/app/topology.json:ro

